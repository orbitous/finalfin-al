<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>finalfin.al — prototype v2</title>
<style>
  :root {
    --paper: #e9edf0;
    --card: #f7f8f6;
    --ink: #16213a;
    --ink-soft: #5b6472;
    --miss: #b3261e;
    --hit: #3f6b4e;
    --hit-bg: #e3ecdf;
    --miss-bg: #f6e2e0;
    --border: #d3d8db;
  }
  * { box-sizing: border-box; }

  /* One font family for the whole site — this is the "correct" state.
     The only exception is a document span the content author deliberately
     tags type=font, which the renderer intentionally breaks to Times New
     Roman (see JS) — everything else, in-game and out, inherits this. */
  body {
    margin: 0;
    padding: 40px 20px 80px;
    background: var(--paper);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header { width: 100%; max-width: 640px; margin-bottom: 16px; }
  header h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  header p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  .loadrow {
    width: 100%; max-width: 640px;
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    font-size: 12px; color: var(--ink-soft);
  }
  .loadrow button {
    font-size: 12px;
    background: transparent; color: var(--ink); border: 1px solid var(--border);
    border-radius: 3px; padding: 6px 10px; cursor: pointer;
  }
  .loadrow button:hover { border-color: var(--ink-soft); }

  .statusbar {
    width: 100%; max-width: 640px;
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px; font-size: 13px; color: var(--ink-soft);
  }
  .statusbar strong { color: var(--ink); }

  .stage { width: 100%; max-width: 640px; position: relative; }

  .page {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 36px 40px;
    box-shadow: 0 1px 2px rgba(22,33,58,0.05);
    transition: filter 300ms ease;
  }
  .page.blurred { filter: blur(7px); }

  .page h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .page h3 { font-size: 14px; font-weight: 600; margin: 22px 0 8px; }
  .page h2:not(:first-child), .page h3:not(:first-child) { margin-top: 26px; }
  /* pre-line: a single line break in the source now renders as an actual
     line break instead of collapsing to a space; still wraps normally. */
  .page p { font-size: 16.5px; line-height: 1.75; margin: 0 0 18px; white-space: pre-line; }

  .list-line { font-size: 15.5px; line-height: 1.85; margin: 2px 0; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; margin: 6px 0; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-weight: 600; }

  /* Error targets are invisible until found or revealed — no hover style,
     no cursor change, nothing that leaks their location. */
  .err-target { border-radius: 2px; }
  .err-target.found { background: var(--hit-bg); color: var(--hit); }
  .err-target.revealed { background: var(--miss-bg); color: var(--miss); text-decoration: underline wavy; }

  /* Begin overlay, shown while the page is blurred */
  .begin-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .begin-overlay button {
    font-size: 14px;
    background: var(--ink); color: var(--card); border: none; border-radius: 4px;
    padding: 12px 28px; cursor: pointer;
  }

  /* The hit-testing layer: absolutely positioned, filling .page exactly.
     Individual zones are sized/positioned in JS from measured text rects. */
  #overlay { position: absolute; inset: 0; }
  .miss-catcher, .hit-zone { position: absolute; cursor: default; }
  .miss-catcher { background: transparent; }
  .hit-zone { background: transparent; }

  .page.shake { animation: shake 220ms; }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

  .result { width: 100%; max-width: 640px; margin-top: 18px; font-size: 13px; }
  .result.hidden { display: none; }
  .result .headline { font-size: 14.5px; font-weight: 500; margin-bottom: 6px; }
  .result .line { color: var(--ink-soft); margin: 2px 0; }
  .result .types { margin: 10px 0; padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 3px; }
  .result .types div { display: flex; justify-content: space-between; padding: 2px 0; }

  button.primary {
    font-size: 13px;
    background: var(--ink); color: var(--card); border: none; border-radius: 3px;
    padding: 9px 16px; cursor: pointer; margin-top: 10px;
  }

  /* Mobile pass. The desktop layout already scales down via max-width and
     percentage widths — this tier exists specifically for the things that
     don't shrink gracefully on their own: fixed padding that eats too much
     of a narrow screen, a 4-item flex row with no room to breathe, and
     tables, which never handle narrow containers well on their own. */
  @media (max-width: 480px) {
    body { padding: 20px 12px 50px; }
    .page { padding: 22px 18px; }
    .statusbar { flex-wrap: wrap; row-gap: 6px; font-size: 12px; }
    .loadrow { flex-wrap: wrap; row-gap: 8px; }
    #fileLabel { flex: 1 1 100%; }
    table, .list-line { font-size: 14px; }
    th, td { padding: 6px 8px; }
  }
</style>
</head>
<body>

  <header>
    <h1>finalfin.al</h1>
    <p>2 minutes. Find every tagged inconsistency before time, or your guesses, run out.</p>
  </header>

  <div class="loadrow">
    <span id="fileLabel">sample-challenge.md (built-in)</span>
    <button id="loadBtn">Load challenge (.md)</button>
    <input type="file" id="fileInput" accept=".md,text/markdown" style="display:none;">
  </div>

  <div class="statusbar">
    <span>score <strong id="scoreVal">0</strong></span>
    <span>found <strong id="foundVal">0</strong>/<strong id="totalVal">0</strong></span>
    <span>misses <strong id="missVal">0</strong></span>
    <span id="timeVal">2:00</span>
  </div>

  <div class="stage">
    <div class="page blurred" id="page"></div>
    <div class="begin-overlay ui" id="beginOverlay">
      <button id="beginBtn">Begin</button>
    </div>
  </div>

  <div class="result hidden ui" id="result">
    <div class="headline" id="resultHeadline"></div>
    <div class="line" id="resultScore"></div>
    <div class="types" id="resultTypes"></div>
    <button class="primary" id="resetBtn">Play again</button>
    <div class="line" id="dailyNote" style="display:none; margin-top:10px;">
      Today's puzzle is done — come back tomorrow for the next one.
      <a href="#" id="devResetLink" style="color:var(--ink-soft);">(reset today's result — testing only)</a>
    </div>
  </div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const TIME_LIMIT = 120;          // seconds
const POINTS_PER_FIND = 15;
const POINTS_PER_MISS = 5;       // subtracted, no cap on how many you can take
const TIME_BONUS_PER_SECOND = 2; // awarded on a win, for time left on the clock
// A mouse can click precisely; a fingertip can't. 'pointer: coarse' asks
// the browser directly whether the primary input is imprecise (touch)
// rather than guessing from screen width — a narrow desktop window still
// has a precise mouse, so width alone would give the wrong answer here.
const TOLERANCE = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ? 14 : 6;
const SPAM_WINDOW_MS = 1500;     // spam = this many clicks...
const SPAM_CLICK_COUNT = 5;      // ...within this many milliseconds, hit or miss

const ERROR_LABELS = {
  dash: 'Dash mismatch', currency: 'Currency symbol', quotes: 'Quote mark mismatch',
  footnote: 'Footnote placement', punctuation: 'Punctuation usage', formatting: 'Bold, italic, or underline misuse',
  font: 'Font mismatch', sizeSmall: 'Font size mismatch (smaller)', sizeBig: 'Font size mismatch (larger)',
  'heading-number': 'Section numbering', listnum: 'List numbering',
  indent: 'Indentation', table: 'Table error', spelling: 'Spelling error'
};

/* ============================================================
   MARKDOWN + TAG PARSER
   Small and scoped on purpose — see chat for why. It understands:
   headings (#, ##), paragraphs, lists (-, *), tables (| a | b |),
   bold (**x**), italic (*x*), and three tag forms:
     token<<ERR:type>>            — attaches to the preceding word
                                     (this covers heading numbers too — "5."
                                     is just a token like any other)
     [[a phrase]]<<ERR:type>>     — attaches to a multi-word span
     <<ERR:type>> at line start   — attaches to the whole list item
       (used for indent, where the click area is generous but only the
       bullet itself highlights — see renderDocument)
   ============================================================ */

// A tag can optionally carry :id=NAME so multiple separate spans register
// as ONE logical error (e.g. an opening and closing quote mark that don't
// match — two small spans, one thing to find). Without :id, each tag is
// its own independent error, as before.
const ERR_TAG_RE = /^<<ERR:([a-zA-Z0-9-]+)(?::id=([a-zA-Z0-9_-]+))?>>/;

// Walks one line/cell's text and returns a list of "inline nodes":
// {text, bold, italic, underline, errorType, errorId}. Same idea as
// writing a small tokenizer in Python with an index you manually advance.
function parseInline(text) {
  const nodes = [];
  let i = 0, buf = '';

  function flush() {
    if (buf) { nodes.push({ text: buf, bold: false, italic: false, underline: false, errorType: null, errorId: null }); buf = ''; }
  }
  function peekTag() {
    const m = text.slice(i).match(ERR_TAG_RE);
    if (m) { i += m[0].length; return { type: m[1], id: m[2] || null }; }
    return { type: null, id: null };
  }

  while (i < text.length) {
    if (text.startsWith('[[', i)) {
      const end = text.indexOf(']]', i + 2);
      if (end !== -1) {
        flush();
        const span = text.slice(i + 2, end);
        i = end + 2;
        const tag = peekTag();
        // Re-parse the bracket's own contents rather than treating them as
        // literal text — this is what makes [[_italic phrase_]] render as
        // actual italics instead of showing the underscores. If a type was
        // tagged, every piece that comes out of that inner parse shares one
        // id, so a multi-node result (e.g. plain text + a bold run) still
        // highlights and counts as a single error.
        const innerNodes = parseInline(span);
        if (tag.type) {
          const sharedId = tag.id || nextId();
          innerNodes.forEach(sub => {
            if (!sub.errorType) { sub.errorType = tag.type; sub.errorId = sharedId; }
          });
        }
        nodes.push(...innerNodes);
        continue;
      }
    }
    // Underline has no standard markdown syntax, so this uses a raw HTML
    // tag pair — a reasonable custom choice since <u> already means
    // exactly this. Checked before ** / * so it isn't mistaken for text.
    if (text.startsWith('<u>', i)) {
      const end = text.indexOf('</u>', i + 3);
      if (end !== -1) {
        flush();
        const inner = text.slice(i + 3, end);
        i = end + 4;
        const tag = peekTag();
        nodes.push({ text: inner, bold: false, italic: false, underline: true, errorType: tag.type, errorId: tag.id });
        continue;
      }
    }
    if (text.startsWith('**', i)) {
      const end = text.indexOf('**', i + 2);
      if (end !== -1) {
        flush();
        const inner = text.slice(i + 2, end);
        i = end + 2;
        const tag = peekTag();
        nodes.push({ text: inner, bold: true, italic: false, underline: false, errorType: tag.type, errorId: tag.id });
        continue;
      }
    }
    // Single asterisk OR single underscore both mean italic — the same
    // two spellings CommonMark accepts, so *word* and _word_ behave the
    // same way here.
    if (text[i] === '*' || text[i] === '_') {
      const marker = text[i];
      const end = text.indexOf(marker, i + 1);
      if (end !== -1) {
        flush();
        const inner = text.slice(i + 1, end);
        i = end + 1;
        const tag = peekTag();
        nodes.push({ text: inner, bold: false, italic: true, underline: false, errorType: tag.type, errorId: tag.id });
        continue;
      }
    }
    if (text.startsWith('<<ERR:', i)) {
      const m = text.slice(i).match(ERR_TAG_RE);
      if (m) {
        const tm = buf.match(/(\S+)$/);
        if (tm) {
          const token = tm[1];
          const before = buf.slice(0, buf.length - token.length);
          if (before) nodes.push({ text: before, bold: false, italic: false, underline: false, errorType: null, errorId: null });
          nodes.push({ text: token, bold: false, italic: false, underline: false, errorType: m[1], errorId: m[2] || null });
          buf = '';
        }
        i += m[0].length;
        continue;
      }
    }
    buf += text[i]; i++;
  }
  flush();
  return nodes;
}

function parseDocument(src) {
  // Strip <!-- ... --> blocks before anything else, so authoring notes
  // never show up as playable text. Standard markdown convention, so
  // this file also previews correctly in any normal markdown viewer.
  src = src.replace(/<!--[\s\S]*?-->/g, '');
  const lines = src.replace(/\r\n/g, '\n').split('\n');
  const blocks = [];
  let i = 0;
  const isBlank = l => l.trim() === '';
  const isTable = l => l.trim().startsWith('|');
  const headingRe = /^(#{1,3})\s+(.*)$/;
  // Marker is a bullet (-, *, •) OR a number like "1." / "2)" — the number
  // is kept and rendered exactly as typed (not auto-renumbered), since a
  // wrong number is how a numbering error gets planted. The tag sits right
  // after the marker, not at the very start of the line.
  const listRe = /^\s*([-*•]|\d+[.)])\s*(<<ERR:([a-zA-Z0-9-]+)>>)?\s+(.*)$/;

  while (i < lines.length) {
    const line = lines[i];
    if (isBlank(line)) { i++; continue; }

    if (isTable(line)) {
      const rows = [];
      while (i < lines.length && isTable(lines[i])) { rows.push(lines[i]); i++; }
      const cells = rows
        .map(r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()))
        .filter(r => !r.every(c => /^-+$/.test(c))); // drop the --- separator row
      blocks.push({ type: 'table', header: cells[0], rows: cells.slice(1) });
      continue;
    }

    const h = line.match(headingRe);
    if (h) {
      blocks.push({ type: 'heading', level: h[1].length, inline: parseInline(h[2]) });
      i++; continue;
    }

    const l0 = line.match(listRe);
    if (l0) {
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(listRe);
        if (!m) break;
        items.push({ marker: m[1], lineError: m[3] || null, inline: parseInline(m[4]) });
        i++;
      }
      blocks.push({ type: 'list', items });
      continue;
    }

    const para = [];
    while (i < lines.length && !isBlank(lines[i]) && !isTable(lines[i]) && !headingRe.test(lines[i]) && !listRe.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    blocks.push({ type: 'paragraph', inline: parseInline(para.join('\n')) });
  }
  return blocks;
}

/* ============================================================
   RENDERING
   Every tagged node/line gets a sequential id and is registered
   in errorRegistry so the overlay engine knows what to measure.
   ============================================================ */
let errorRegistry = {};
let errorCounter = 0;

function nextId() { return 'e' + (++errorCounter); }

// Registers one tagged element against an error. If explicitId is given
// and already exists, this element joins that error's existing spans
// instead of creating a new one — that's how two separate quote-mark
// spans become one findable error.
function registerError(type, explicitId, el) {
  const id = explicitId || nextId();
  if (errorRegistry[id]) {
    errorRegistry[id].highlightEls.push(el);
    errorRegistry[id].hitEls.push(el);
  } else {
    errorRegistry[id] = { type, found: false, highlightEls: [el], hitEls: [el] };
  }
  return id;
}

function renderInline(nodes, parent) {
  nodes.forEach(n => {
    let el;
    if (n.bold) el = document.createElement('strong');
    else if (n.italic) el = document.createElement('em');
    else el = document.createElement('span');
    el.textContent = n.text;
    if (n.underline) el.style.textDecoration = 'underline';
    if (n.errorType) {
      el.classList.add('err-target');
      const id = registerError(n.errorType, n.errorId, el);
      el.dataset.errorId = id;
      if (n.errorType === 'font') el.style.fontFamily = "'Times New Roman', Times, serif";
      if (n.errorType === 'sizeSmall') el.style.fontSize = '0.85em'; // -15%
      if (n.errorType === 'sizeBig') el.style.fontSize = '1.15em';   // +15%
    }
    parent.appendChild(el);
  });
}

function renderDocument(blocks, container) {
  container.innerHTML = '';

  blocks.forEach(b => {
    if (b.type === 'heading') {
      const el = document.createElement(b.level === 1 ? 'h2' : 'h3');
      renderInline(b.inline, el);
      container.appendChild(el);
    } else if (b.type === 'paragraph') {
      const el = document.createElement('p');
      renderInline(b.inline, el);
      container.appendChild(el);
    } else if (b.type === 'list') {
      const wrap = document.createElement('div');
      b.items.forEach(item => {
        const line = document.createElement('div');
        line.className = 'list-line';
        const marker = document.createElement('span');
        const isNumbered = /^\d+[.)]$/.test(item.marker);
        marker.textContent = (isNumbered ? item.marker : '•') + ' ';
        if (item.lineError) {
          line.appendChild(marker);
          renderInline(item.inline, line);
          const id = nextId();
          marker.classList.add('err-target');
          marker.dataset.errorId = id;
          if (item.lineError === 'indent') line.style.marginLeft = '34px';
          // Highlight is scoped to just the marker; the click zone stays
          // the whole line, since that's what a player will reasonably
          // click, whether the tell is a shift or a bad number.
          errorRegistry[id] = { type: item.lineError, found: false, highlightEls: [marker], hitEls: [line] };
        } else {
          line.appendChild(marker);
          renderInline(item.inline, line);
        }
        wrap.appendChild(line);
      });
      container.appendChild(wrap);
    } else if (b.type === 'table') {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      const table = document.createElement('table');
      const thead = document.createElement('tr');
      b.header.forEach(c => {
        const th = document.createElement('th');
        renderInline(parseInline(c), th);
        thead.appendChild(th);
      });
      table.appendChild(thead);
      b.rows.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(c => {
          const td = document.createElement('td');
          renderInline(parseInline(c), td);
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      wrap.appendChild(table);
      container.appendChild(wrap);
    }
  });
}

/* ============================================================
   OVERLAY — the resolution-independent hit-testing layer.
   Never authored as fixed coordinates: every zone is measured
   from the live rendered position of its text, so it stays
   correctly aligned no matter the screen width or zoom level.
   ============================================================ */
const page = document.getElementById('page');
let overlayEl = null;

function ensureOverlay() {
  if (overlayEl) overlayEl.remove();
  overlayEl = document.createElement('div');
  overlayEl.id = 'overlay';
  page.appendChild(overlayEl);
  return overlayEl;
}

function recomputeOverlay() {
  const ov = ensureOverlay();
  const pageRect = page.getBoundingClientRect();

  // Bottom layer: anywhere that isn't a valid hit zone counts as a miss.
  const missCatcher = document.createElement('div');
  missCatcher.className = 'miss-catcher';
  missCatcher.style.left = '0'; missCatcher.style.top = '0';
  missCatcher.style.width = pageRect.width + 'px';
  missCatcher.style.height = page.scrollHeight + 'px';
  missCatcher.addEventListener('click', () => handleGuess(null));
  ov.appendChild(missCatcher);

  // Top layer: one zone per measured rect (a tagged span can wrap
  // across lines, so getClientRects() may return more than one).
  Object.entries(errorRegistry).forEach(([id, entry]) => {
    entry.hitEls.forEach(el => {
      const rects = el.getClientRects();
      Array.from(rects).forEach(r => {
        const zone = document.createElement('div');
        zone.className = 'hit-zone';
        zone.style.left = (r.left - pageRect.left - TOLERANCE) + 'px';
        zone.style.top = (r.top - pageRect.top - TOLERANCE) + 'px';
        zone.style.width = (r.width + TOLERANCE * 2) + 'px';
        zone.style.height = (r.height + TOLERANCE * 2) + 'px';
        zone.addEventListener('click', () => handleGuess(id));
        ov.appendChild(zone);
      });
    });
  });
}

let resizeHandle;
window.addEventListener('resize', () => {
  clearTimeout(resizeHandle);
  resizeHandle = setTimeout(recomputeOverlay, 150);
});
window.addEventListener('orientationchange', () => {
  clearTimeout(resizeHandle);
  resizeHandle = setTimeout(recomputeOverlay, 150);
});

/* ============================================================
   GAME STATE
   ============================================================ */
let totalErrors = 0, foundCount = 0, missCount = 0, score = 0, timeLeft = TIME_LIMIT;
let gameOver = true, started = false, timerHandle = null;
let clickTimestamps = []; // rolling window, used only to detect spam-clicking
let isDailyMode = false;     // true = the auto-loaded, once-per-day puzzle
let currentPuzzleDate = null; // the date key this session's puzzle is filed under

function updateStatus() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('foundVal').textContent = foundCount;
  document.getElementById('totalVal').textContent = totalErrors;
  document.getElementById('missVal').textContent = missCount;
  const m = Math.floor(Math.max(timeLeft, 0) / 60), s = Math.max(timeLeft, 0) % 60;
  document.getElementById('timeVal').textContent = m + ':' + String(s).padStart(2, '0');
}

function handleGuess(id) {
  if (gameOver || !started) return;
  if (id && errorRegistry[id].found) return; // already found — no-op, no penalty

  // Spam detection is about click RATE, not about being wrong. A thoughtful
  // wrong guess costs points but never ends the game on its own; only
  // clicking fast enough to look like spamming does.
  const now = Date.now();
  clickTimestamps.push(now);
  clickTimestamps = clickTimestamps.filter(t => now - t <= SPAM_WINDOW_MS);
  if (clickTimestamps.length >= SPAM_CLICK_COUNT) { endGame('lockout'); return; }

  if (id) {
    errorRegistry[id].found = true;
    errorRegistry[id].highlightEls.forEach(el => el.classList.add('found'));
    foundCount++; score += POINTS_PER_FIND;
  } else {
    score -= POINTS_PER_MISS; missCount++;
    page.classList.remove('shake'); void page.offsetWidth; page.classList.add('shake');
  }
  updateStatus();

  if (foundCount === totalErrors) endGame('win');
}

// Renders the result panel from whatever the current state variables say —
// used both right after a live game ends AND when re-displaying a stored
// completion on a later visit, so the two never drift out of sync.
function buildResultUI(reason, bonus) {
  const headline = { win: 'Solved it', timeout: "Time's up", lockout: 'Slow down — that was too fast' }[reason];
  document.getElementById('resultHeadline').textContent = headline;
  const parts = [
    `${foundCount}/${totalErrors} found (+${foundCount * POINTS_PER_FIND})`,
    `${missCount} miss${missCount === 1 ? '' : 'es'} (-${missCount * POINTS_PER_MISS})`
  ];
  if (bonus) parts.push(`+${bonus} time bonus`);
  parts.push(`final score ${score}`);
  document.getElementById('resultScore').textContent = parts.join(' · ');

  const typesEl = document.getElementById('resultTypes');
  typesEl.innerHTML = '';
  Object.values(errorRegistry).forEach(e => {
    const row = document.createElement('div');
    const label = ERROR_LABELS[e.type] || e.type;
    row.innerHTML = `<span>${label}</span><span style="color:${e.found ? 'var(--hit)' : 'var(--miss)'}">${e.found ? 'found' : 'missed'}</span>`;
    typesEl.appendChild(row);
  });

  // Daily puzzles get one attempt — no replay button, just a note. Manually
  // loaded test files (isDailyMode false) keep full replay for testing.
  document.getElementById('resetBtn').style.display = isDailyMode ? 'none' : '';
  document.getElementById('dailyNote').style.display = isDailyMode ? 'block' : 'none';

  document.getElementById('result').classList.remove('hidden');
  updateStatus();
}

function endGame(reason) {
  gameOver = true;
  clearInterval(timerHandle);
  Object.values(errorRegistry).forEach(e => {
    if (!e.found) e.highlightEls.forEach(el => el.classList.add('revealed'));
  });

  let bonus = 0;
  if (reason === 'win') { bonus = timeLeft * TIME_BONUS_PER_SECOND; score += bonus; }

  buildResultUI(reason, bonus);

  if (isDailyMode && currentPuzzleDate) {
    const foundIds = Object.entries(errorRegistry).filter(([, e]) => e.found).map(([id]) => id);
    saveCompletion(currentPuzzleDate, { reason, score, foundCount, totalErrors, missCount, bonus, foundIds, completedAt: Date.now() });
  }
}

function startTimer() {
  clearInterval(timerHandle); // never let two intervals run at once
  timerHandle = setInterval(() => {
    timeLeft--;
    updateStatus();
    if (timeLeft <= 0) endGame('timeout');
  }, 1000);
}

/* ============================================================
   DAILY PUZZLE — storage, file splitting, date resolution
   ============================================================ */
const STORAGE_PREFIX = 'finalfinal:completed:';

function saveCompletion(date, record) {
  try { localStorage.setItem(STORAGE_PREFIX + date, JSON.stringify(record)); }
  catch (e) { console.warn('Could not save today\'s result (localStorage unavailable):', e); }
}
function loadCompletion(date) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + date);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// Local date, not UTC — "today" should match the player's own calendar day,
// not flip over at UTC midnight while it's still evening for them.
function getTodayDateString() {
  const d = new Date();
  return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear();
}

// DD-MM-YYYY doesn't sort correctly as plain text (unlike YYYY-MM-DD), so
// anywhere dates need comparing, convert to this YYYYMMDD form first —
// display and storage keys stay DD-MM-YYYY everywhere else.
function dmyToSortKey(dmy) {
  const [d, m, y] = dmy.split('-');
  return y + m + d;
}

// Splits a multi-puzzle file on <<PUZZLE:DD-MM-YYYY>> markers into
// { "03-09-2026": "...markdown for that day...", ... }. A file with no
// markers at all is treated as one single puzzle, so an old single-puzzle
// test file still loads without needing to be rewritten.
function splitPuzzles(rawText) {
  const re = /<<PUZZLE:(\d{2}-\d{2}-\d{4})>>/g;
  const matches = [];
  let m;
  while ((m = re.exec(rawText)) !== null) matches.push({ date: m[1], start: m.index, contentStart: m.index + m[0].length });
  if (matches.length === 0) return { __single: rawText };
  const puzzles = {};
  matches.forEach((mt, idx) => {
    const sliceEnd = idx + 1 < matches.length ? matches[idx + 1].start : rawText.length;
    puzzles[mt.date] = rawText.slice(mt.contentStart, sliceEnd);
  });
  return puzzles;
}

// Exact match wins. Otherwise the most recent date at or before today (so
// today's file just hasn't been split into a new entry yet still shows the
// latest available puzzle). Otherwise, everything's in the future — show
// the earliest one so there's always something to play. Sorting and the
// <= comparison both go through dmyToSortKey — plain string comparison on
// DD-MM-YYYY would pick the wrong puzzle around month/year boundaries.
function pickPuzzleDate(puzzles, todayStr) {
  const dates = Object.keys(puzzles);
  if (dates.length === 1 && dates[0] === '__single') return '__single';
  const sorted = dates.slice().sort((a, b) => dmyToSortKey(a).localeCompare(dmyToSortKey(b)));
  if (sorted.includes(todayStr)) return todayStr;
  const todayKey = dmyToSortKey(todayStr);
  const past = sorted.filter(d => dmyToSortKey(d) <= todayKey);
  return past.length ? past[past.length - 1] : sorted[0];
}

// Re-displays a stored completion without re-playing: parses and renders
// the puzzle as usual, then marks the same errors found/revealed that were
// found/revealed originally, and shows the result panel from the saved
// numbers rather than live state.
function showReviewFromStorage(record) {
  gameOver = true; started = false;
  foundCount = record.foundCount; missCount = record.missCount; score = record.score;
  record.foundIds.forEach(id => {
    if (errorRegistry[id]) { errorRegistry[id].found = true; errorRegistry[id].highlightEls.forEach(el => el.classList.add('found')); }
  });
  Object.values(errorRegistry).forEach(e => {
    if (!e.found) e.highlightEls.forEach(el => el.classList.add('revealed'));
  });
  page.classList.remove('blurred');
  document.getElementById('beginOverlay').style.display = 'none';
  buildResultUI(record.reason, record.bonus);
}

async function initDailyPuzzle() {
  const params = new URLSearchParams(window.location.search);
  const todayStr = params.get('date') || getTodayDateString(); // ?date= override for testing other days

  let puzzles;
  try {
    const res = await fetch('puzzles.md');
    if (!res.ok) throw new Error('puzzles.md not found');
    puzzles = splitPuzzles(await res.text());
  } catch (e) {
    // Expected when opened directly as a local file (file:// blocks fetch
    // entirely) or when puzzles.md isn't sitting next to this HTML file.
    // Falls back to the built-in single puzzle so daily-mode is still
    // fully testable without real hosting.
    puzzles = { __single: DEFAULT_MARKDOWN };
  }

  const pickedDate = pickPuzzleDate(puzzles, todayStr);
  currentPuzzleDate = pickedDate === '__single' ? todayStr : pickedDate;
  isDailyMode = true;
  document.getElementById('fileLabel').textContent =
    pickedDate === '__single' ? 'built-in puzzle (puzzles.md not found)' : `puzzles.md — ${pickedDate}`;

  loadChallenge(puzzles[pickedDate]);
  currentMarkdown = puzzles[pickedDate];

  const record = loadCompletion(currentPuzzleDate);
  if (record) showReviewFromStorage(record);
}


function loadChallenge(markdownText) {
  // A previous countdown may still be running if this fires mid-game (e.g.
  // loading a new .md file before the current one finished) — clear it or
  // it keeps ticking in the background, invisibly stacking with any later
  // timer and draining time faster than 1 second per second.
  clearInterval(timerHandle);

  // Reset once, before parsing — parseDocument can now itself call nextId()
  // (for bracket spans with formatting inside them), and renderDocument
  // calls it again afterwards for everything else. Both need to share one
  // uninterrupted counter; resetting it between the two would let a
  // parse-time id and a render-time id collide on the same number.
  errorRegistry = {};
  errorCounter = 0;

  const blocks = parseDocument(markdownText);
  renderDocument(blocks, page);
  totalErrors = Object.keys(errorRegistry).length;
  foundCount = 0; missCount = 0; score = 0; timeLeft = TIME_LIMIT; gameOver = false; started = false;
  clickTimestamps = [];

  page.classList.add('blurred');
  document.getElementById('beginOverlay').style.display = 'flex';
  document.getElementById('result').classList.add('hidden');

  document.fonts.ready.then(recomputeOverlay);
  recomputeOverlay();
  updateStatus();
}

let currentMarkdown = null;

document.getElementById('beginBtn').addEventListener('click', () => {
  page.classList.remove('blurred');
  document.getElementById('beginOverlay').style.display = 'none';
  started = true;
  recomputeOverlay();
  startTimer();
});

document.getElementById('resetBtn').addEventListener('click', () => loadChallenge(currentMarkdown));

document.getElementById('loadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    isDailyMode = false; // manual loads are always testing/free-play, never locked
    const raw = reader.result;
    const puzzles = splitPuzzles(raw);
    const dates = Object.keys(puzzles);
    if (dates.length === 1 && dates[0] === '__single') {
      // A plain single-puzzle file, same as before — no date logic involved.
      currentMarkdown = raw;
      document.getElementById('fileLabel').textContent = file.name;
    } else {
      // A multi-puzzle file loaded by hand: run the same date resolution
      // the real fetch path uses, so this button doubles as a no-server
      // way to check which puzzle a given date would pick. Still free-play
      // (isDailyMode is false), so this never touches the daily lock.
      const params = new URLSearchParams(window.location.search);
      const todayStr = params.get('date') || getTodayDateString();
      const pickedDate = pickPuzzleDate(puzzles, todayStr);
      currentMarkdown = puzzles[pickedDate];
      document.getElementById('fileLabel').textContent = `${file.name} — ${pickedDate}`;
    }
    loadChallenge(currentMarkdown);
  };
  reader.readAsText(file);
});

document.getElementById('devResetLink').addEventListener('click', e => {
  e.preventDefault();
  if (currentPuzzleDate) localStorage.removeItem(STORAGE_PREFIX + currentPuzzleDate);
  location.reload();
});
